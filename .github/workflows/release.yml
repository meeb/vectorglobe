name: Release

# Fires on every version tag push (e.g. after `npm version minor && git push --follow-tags`). One
# push does the whole release: publish to npm, then record it as a GitHub Release. Nothing to install
# or click - the gh CLI used below ships preinstalled on GitHub-hosted runners.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Auto-created on first run with no protection rules. Add required reviewers to it later
    # (Settings -> Environments -> npm-publish) for a manual approval gate before anything publishes.
    # The name must match the trusted publisher configured on the npmjs.com package settings page.
    environment: npm-publish
    permissions:
      # Lets the release step below create a GitHub Release for this tag.
      contents: write
      # This is what lets npm exchange a short-lived OIDC token for publish rights - no npm token
      # secret stored in the repo at all, nothing to leak or rotate.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # v7 caches dependencies by default; disabled here so what gets published always comes
          # from a clean install rather than a warm cache.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+; the npm bundled with Node 22 is older than that.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      # Catches "tagged the wrong commit" or "forgot to bump the version" before anything is published.
      - name: Verify the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Also enforces the bundle size budget - a release that blows the budget fails here, before
      # anything is published.
      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      # Documentation only, and deliberately after the npm publish above: if this step fails the
      # package is still published, and the release record can always be created by hand afterwards.
      #
      # Idempotent on purpose: if a Release for this tag already exists - most likely because it was
      # created by hand in the GitHub UI, which is what created the tag that triggered this run in the
      # first place - leave it alone instead of failing on the resulting 422.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "a release for $GITHUB_REF_NAME already exists, leaving it as is"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
